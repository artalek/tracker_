{% if operator and contact %}
  <p>Оператор данных — {{ operator }}. Электронная почта для обращений — <a class="text-link" href="mailto:{{ contact }}">{{ contact }}</a>.</p>
{% else %}
  <p class="muted">Учебная редакция. Владелец публичного экземпляра указывает здесь своё имя или наименование и контакт для обращений.</p>
{% endif %}
