{% extends "tracker/base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<section class="panel auth-card">
  <h1>Регистрация</h1>
  <p class="muted">Создайте аккаунт, чтобы сохранять конвертации и валютные пары.</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_div }}
    <button class="button primary wide">Создать аккаунт</button>
  </form>
  <p class="muted">Уже есть аккаунт? <a class="text-link" href="{% url 'tracker:login' %}">Войти</a></p>
</section>
{% endblock %}
