{% extends "tracker/base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="panel auth-card">
  <h1>Вход</h1>
  <p class="muted">Откройте историю конвертаций и избранные пары.</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="button primary wide">Войти</button>
  </form>
  <p class="muted">Впервые здесь? <a class="text-link" href="{% url 'tracker:register' %}">Создать аккаунт</a></p>
</section>
{% endblock %}
